# =============================================================
#  Maal — Nginx server block (PHP-FPM)
#  Place at /etc/nginx/sites-available/maal and symlink to sites-enabled.
# =============================================================

server {
    listen 80;
    server_name your-domain.com;
    # Redirect all HTTP to HTTPS (enable after TLS is configured).
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name your-domain.com;

    root /var/www/maal/public;
    index index.php;

    # ----- TLS (use certbot / your provider) -----
    ssl_certificate     /etc/letsencrypt/live/your-domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;

    # ----- Security headers -----
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    charset utf-8;
    client_max_body_size 64M;   # upload chunks are small; raise if needed

    # ----- Gzip -----
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/vnd.apple.mpegurl;
    gzip_min_length 256;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Long-cache static assets.
    location ~* \.(jpg|jpeg|png|webp|gif|ico|svg|woff2?|css|js)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri /index.php?$query_string;
    }

    # HLS playlists must not be cached at the edge (signed + short-lived).
    location ~* \.m3u8$ {
        add_header Cache-Control "no-store";
        try_files $uri /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ ^/index\.php(/|$) {
        fastcgi_pass unix:/var/run/php/php8.2-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 300;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}

# -------------------------------------------------------------
#  NOTE on HLS delivery at scale:
#  The app proxies signed HLS through /stream/hls/{token}/... which is correct
#  but routes bandwidth through PHP. For production scale, front the media
#  bucket with a CDN (Cloudflare/CloudFront) and set CDN_URL, or terminate
#  signed-cookie auth at the CDN edge. Originals must remain private.
# -------------------------------------------------------------
