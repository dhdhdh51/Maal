[program:maal-analytics]
command=php /var/www/maal/artisan queue:work redis --queue=analytics --sleep=10 --tries=3 --timeout=300 --max-time=3600
directory=/var/www/maal
autostart=true
autorestart=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/maal/storage/logs/worker-analytics.log

[program:maal-default]
command=php /var/www/maal/artisan queue:work redis --queue=default --sleep=3 --tries=3 --timeout=120 --max-time=3600
directory=/var/www/maal
autostart=true
autorestart=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/maal/storage/logs/worker-default.log
