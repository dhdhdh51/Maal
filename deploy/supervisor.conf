# =============================================================
#  Maal — Supervisor queue workers
#  Copy to /etc/supervisor/conf.d/maal.conf then:
#    supervisorctl reread && supervisorctl update && supervisorctl start all
#
#  Dedicated workers per queue channel so heavy transcoding never blocks
#  notifications/analytics. Adjust numprocs to your CPU budget.
# =============================================================

[group:maal]
programs=maal-transcoding,maal-previews,maal-thumbnails,maal-uploads,maal-subtitles,maal-notifications,maal-analytics,maal-default

[program:maal-transcoding]
command=php /var/www/maal/artisan queue:work redis --queue=transcoding --sleep=3 --tries=3 --backoff=30 --timeout=21600 --max-time=3600
directory=/var/www/maal
autostart=true
autorestart=true
user=www-data
numprocs=2
stopwaitsecs=3600
redirect_stderr=true
stdout_logfile=/var/www/maal/storage/logs/worker-transcoding.log

[program:maal-previews]
command=php /var/www/maal/artisan queue:work redis --queue=previews --sleep=3 --tries=3 --backoff=30 --timeout=3600 --max-time=3600
directory=/var/www/maal
autostart=true
autorestart=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/maal/storage/logs/worker-previews.log

[program:maal-thumbnails]
command=php /var/www/maal/artisan queue:work redis --queue=thumbnails --sleep=3 --tries=3 --timeout=1200 --max-time=3600
directory=/var/www/maal
autostart=true
autorestart=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/maal/storage/logs/worker-thumbnails.log

[program:maal-uploads]
command=php /var/www/maal/artisan queue:work redis --queue=uploads --sleep=3 --tries=3 --timeout=600 --max-time=3600
directory=/var/www/maal
autostart=true
autorestart=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/maal/storage/logs/worker-uploads.log

[program:maal-subtitles]
command=php /var/www/maal/artisan queue:work redis --queue=subtitles --sleep=5 --tries=3 --timeout=600 --max-time=3600
directory=/var/www/maal
autostart=true
autorestart=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/maal/storage/logs/worker-subtitles.log

[program:maal-notifications]
command=php /var/www/maal/artisan queue:work redis --queue=notifications --sleep=3 --tries=5 --timeout=120 --max-time=3600
directory=/var/www/maal
autostart=true
autorestart=true
user=www-data
